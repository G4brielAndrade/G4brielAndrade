# Nome da Actions:
name: Snake Game

# Quando a Action será executada
on:
  schedule:
    # Atualiza uma vez por dia à meia-noite (UTC)
    - cron: "0 0 * * *"
  # Permite execução manual via botão no GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      # Faz o checkout do repositório (versão v4 para melhorias)
      - uses: actions/checkout@v4

      # Gera os arquivos da cobrinha (usando uma versão específica para estabilidade)
      - uses: Platane/snk@v3.0.1 # Verifique a última release no repositório Platane/snk
        id: snake-gif
        with:
          github_user_name: G4brielAndrade
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Configura Git para poder dar commit
      - name: Config Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      # Faz push das mudanças geradas (usando uma versão específica para estabilidade)
      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0 # Verifique a última release no repositório ad-m/github-push-action
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master # Verifique se o seu branch principal é master ou main
          force: true

      # Publica os arquivos da pasta dist na branch output (usando uma versão específica para estabilidade)
      - uses: crazy-max/ghaction-github-pages@v2.1.3 # Verifique a última release no repositório crazy-max/ghaction-github-pages
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
